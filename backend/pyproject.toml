[project]
name = "loglens"
version = "1.0.0"
description = "AI log analysis and incident report generation"
readme = false
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-otel>=0.15.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "markdown>=3.7",
    "numpy>=1.26.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "regex>=2024.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "sentence-transformers>=3.0.0",
    "slowapi>=0.1.9",
    "structlog>=24.0.0",
    "torch>=2.2.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
